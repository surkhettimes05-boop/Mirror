<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b"><title>MIRROR</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#111114;--line:#27272a;--muted:#a1a1aa;--text:#fafafa;--accent:#e4e4e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.app{max-width:860px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:rgba(9,9,11,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 16px}.brand{display:flex;align-items:center;justify-content:space-between}.brand b{letter-spacing:.18em}.status{font-size:12px;color:#86efac}.modes{display:flex;gap:8px;overflow:auto;padding-top:12px}.mode{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 11px;white-space:nowrap}.mode.active{background:var(--text);color:#09090b}
main{flex:1;padding:18px 14px 140px}.hero{padding:24px 4px 18px}.hero h1{font-size:30px;line-height:1.1;margin:0 0 8px}.hero p{margin:0;color:var(--muted)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.quick button,.card{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px}.quick button{text-align:left;padding:13px}.msg{margin:14px 0;max-width:92%}.msg.user{margin-left:auto;background:#f4f4f5;color:#111;padding:11px 14px;border-radius:16px 16px 4px 16px}.msg.agent{padding:2px 2px}.meta{font-size:11px;color:var(--muted);margin-top:7px}.trace{margin-top:10px}.trace summary,.context summary{cursor:pointer;color:var(--muted);font-size:12px}.trace pre{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:10px;font-size:11px;overflow:auto}.context{margin:12px 0}.context .card{padding:12px;margin-top:8px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.composer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#09090b 22%);padding:30px 12px max(12px,env(safe-area-inset-bottom))}.compose-inner{max-width:832px;margin:auto;border:1px solid #3f3f46;background:#18181b;border-radius:18px;padding:8px;display:flex;align-items:flex-end;gap:8px}textarea{flex:1;resize:none;max-height:150px;min-height:42px;border:0;outline:0;background:transparent;color:white;padding:10px;font:inherit}#send{width:42px;height:42px;border:0;border-radius:12px;font-size:20px}button{cursor:pointer}button:disabled{opacity:.45}.candidate{margin:10px 0;padding:12px;border:1px solid #52525b;border-radius:14px;background:#141417}.candidate-actions{display:flex;gap:8px;margin-top:10px}.candidate-actions button{border:1px solid #3f3f46;border-radius:9px;padding:7px 12px;background:#27272a;color:white}.candidate-actions .approve{background:#fafafa;color:#111}.error{color:#fca5a5}
@media(max-width:520px){.quick{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style></head>
<body><div class="app">
<header><div class="brand"><b>MIRROR</b><span class="status" id="status">● memory connected</span></div><div class="modes" id="modes"></div></header>
<main><section class="hero" id="hero"><h1>Think against yourself.</h1><p>MIRROR remembers your decisions, tests your claims against evidence, and challenges the gap between intention and action.</p></section>
<div class="quick" id="quick">
<button data-q="What am I currently committed to, and what should I do next?"><b>Current commitments</b><br><span class="meta">Retrieve what you said you would do.</span></button>
<button data-q="Challenge my current direction using only evidence you actually have."><b>Challenge me</b><br><span class="meta">Look for contradictions and weak assumptions.</span></button>
<button data-q="What patterns do you currently suspect about me? Separate evidence from inference."><b>Suspected patterns</b><br><span class="meta">Evidence first. No invented psychology.</span></button>
<button id="whyBtn"><b>Why are you saying this?</b><br><span class="meta">Inspect the evidence behind MIRROR's test pattern.</span></button>
</div>
<details class="context"><summary>Current memory context</summary><div id="context"></div></details>
<section id="chat"></section><section id="candidates"></section></main>
<div class="composer"><div class="compose-inner"><textarea id="input" rows="1" placeholder="Tell MIRROR what you're thinking…"></textarea><button id="send">↑</button></div></div>
</div>
<script>
const API=location.origin, USER='mirror-owner';
const modes=['MIRROR','CHALLENGE','DECIDE','DEBRIEF','REVIEW'];let mode='MIRROR';
const el=id=>document.getElementById(id);
function renderModes(){el('modes').innerHTML=modes.map(x=>'<button class="mode '+(x===mode?'active':'')+'" data-mode="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderModes();});}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadContext(){try{const r=await fetch(API+'/memory/context?userId='+USER);if(!r.ok)throw Error(await r.text());const d=await r.json();const goals=(d.goals||[]).map(x=>'<div class="card"><span class="label">Goal</span><br>'+esc(x.title)+'</div>').join('');const dec=(d.recentDecisions||[]).slice(0,2).map(x=>'<div class="card"><span class="label">Decision</span><br>'+esc(x.title)+'</div>').join('');const pats=(d.patterns||[]).map(x=>'<div class="card"><span class="label">Pattern · '+esc(x.status)+'</span><br>'+esc(x.hypothesis)+'</div>').join('');el('context').innerHTML=goals+dec+pats||'<div class="card">No context yet.</div>';}catch(e){el('status').textContent='● API unavailable';el('status').className='status error';}}
function addMsg(role,content,trace){el('hero').style.display='none';el('quick').style.display='none';const d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div>'+esc(content).replace(/\n/g,'<br>')+'</div>'+(trace?'<details class="trace"><summary>Evidence & execution trace</summary><pre>'+esc(JSON.stringify(trace,null,2))+'</pre></details>':'');el('chat').appendChild(d);scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
function renderCandidates(items){if(!items?.length)return;const box=el('candidates');const wrap=document.createElement('div');wrap.innerHTML='<div class="label" style="margin-top:18px">MIRROR noticed — save to memory?</div>'+items.map(c=>{const txt=c.kind==='DECISION'?c.payload.title:c.payload.statement;const warn=c.duplicateWarning?'<div class="meta error">Possible overlap: '+esc(c.duplicateWarning.text)+' ('+Math.round(c.duplicateWarning.score*100)+'%)</div>':'';const date=c.payload.dueAt||c.payload.reviewAt;return '<div class="candidate" id="cand-'+c.id+'"><b>'+esc(c.kind)+'</b><div id="ct-'+c.id+'">'+esc(txt)+'</div>'+(date?'<div class="meta">Date: '+esc(date)+'</div>':'')+warn+'<div class="meta">'+esc(c.rationale||'Candidate durable memory')+'</div><div class="candidate-actions"><button class="approve" data-approve="'+c.id+'">Save</button><button data-edit="'+c.id+'">Edit</button><button data-reject="'+c.id+'">Not memory</button></div></div>'}).join('');box.appendChild(wrap);wrap.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>resolveCandidate(b.dataset.approve,true));wrap.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>resolveCandidate(b.dataset.reject,false));wrap.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editCandidate(b.dataset.edit,items.find(x=>x.id===b.dataset.edit)));}
async function editCandidate(id,c){const key=c.kind==='DECISION'?'title':'statement';const current=c.payload[key]||'';const next=prompt('Edit before saving',current);if(next===null||!next.trim())return;const payload={...c.payload,[key]:next.trim()};const r=await fetch(API+'/capture/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER,payload})});if(r.ok){c.payload=payload;document.getElementById('ct-'+id).textContent=next.trim();}}
async function resolveCandidate(id,approve){try{const r=await fetch(API+'/capture/'+id+'/'+(approve?'approve':'reject'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER})});if(!r.ok)throw Error(await r.text());const card=document.getElementById('cand-'+id);if(card){card.innerHTML='<span class="meta">'+(approve?'Saved to durable memory ✓':'Dismissed — raw conversation remains recorded')+'</span>';}if(approve)loadContext();}catch(e){addMsg('agent','Memory update failed: '+e.message);}}
async function capture(text){try{const r=await fetch(API+'/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER,rawText:text})});if(!r.ok)return;const d=await r.json();renderCandidates(d.candidates||[]);}catch{}}
async function send(text){text=(text||el('input').value).trim();if(!text)return;el('input').value='';addMsg('user',text);capture(text);el('send').disabled=true;const wait=document.createElement('div');wait.className='msg agent meta';wait.id='thinking';wait.textContent='MIRROR is retrieving evidence…';el('chat').appendChild(wait);try{const r=await fetch(API+'/agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:USER,message:'Mode: '+mode+'\n'+text})});const d=await r.json();wait.remove();if(!r.ok)throw Error(d.message||JSON.stringify(d));const content=typeof d.reply==='string'?d.reply:(d.reply?.content||'No response returned.');addMsg('agent',content,d.trace);}catch(e){wait.remove();addMsg('agent','Request failed: '+e.message);}finally{el('send').disabled=false;el('input').focus();}}
async function why(){el('hero').style.display='none';el('quick').style.display='none';addMsg('user','WHY ARE YOU SAYING THIS?');try{const r=await fetch(API+'/why/pattern/seed-pattern-execution-gap?userId='+USER);const d=await r.json();const s=(d.supportingEvidence||[]).map(x=>x.id+': '+x.claim).join('\n');const c=(d.counterEvidence||[]).map(x=>x.id+': '+x.claim).join('\n');addMsg('agent','CLAIM\n'+d.claim+'\n\nSUPPORTING EVIDENCE\n'+(s||'None')+'\n\nCOUNTER-EVIDENCE\n'+(c||'None')+'\n\nRATIONALE\n'+d.inference+'\n\nCONFIDENCE\n'+d.confidence.label+' — '+d.uncertainty);}catch(e){addMsg('agent','WHY lookup failed: '+e.message);}}
renderModes();loadContext();document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));el('whyBtn').onclick=why;el('send').onclick=()=>send();el('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
</script></body></html>
